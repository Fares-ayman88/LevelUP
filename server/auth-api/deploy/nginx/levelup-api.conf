upstream levelup_auth_api {
  server levelup-auth-api:8090;
  keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=2r/s;

server {
  listen 80;
  server_name api.example.com;

  # Replace this block with a certbot redirect after TLS is configured.
  # return 301 https://$host$request_uri;

  client_max_body_size 1024m;
  server_tokens off;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain text/xml;

  location /api/v1/auth/login {
    limit_req zone=auth_rate burst=10 nodelay;
    proxy_pass http://levelup_auth_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/ {
    limit_req zone=api_rate burst=60 nodelay;
    proxy_pass http://levelup_auth_api;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /healthz {
    access_log off;
    proxy_pass http://levelup_auth_api/api/v1/health;
  }
}
