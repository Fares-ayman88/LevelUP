name: levelup

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: levelup
      POSTGRES_USER: levelup
      POSTGRES_PASSWORD: levelup_dev_only
    ports:
      - "5433:5432"
    volumes:
      - levelup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levelup -d levelup"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  levelup-postgres:
