services:
  levelup-auth-api:
    build:
      context: ../..
      dockerfile: server/auth-api/Dockerfile
    image: levelup-auth-api:latest
    container_name: levelup-auth-api
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 8090
    expose:
      - "8090"
    volumes:
      - auth_upload_tmp:/app/server/auth-api/tmp/uploads
      - auth_logs:/app/server/auth-api/logs
    networks:
      - levelup_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: levelup-nginx
    restart: unless-stopped
    depends_on:
      levelup-auth-api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/levelup-api.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - levelup_net

networks:
  levelup_net:
    driver: bridge

volumes:
  auth_upload_tmp:
  auth_logs:
  nginx_logs:
