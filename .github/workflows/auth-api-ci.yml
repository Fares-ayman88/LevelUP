name: Auth API CI

on:
  push:
    branches: [main]
    paths:
      - "server/auth-api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/auth-api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/auth-api/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check auth API
        run: find server/auth-api/src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Build frontend compatibility check
        run: npm run build

      - name: Docker build check
        run: docker build -f server/auth-api/Dockerfile -t levelup-auth-api:ci .

  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/levelup-auth-api" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/auth-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'push' && vars.ENABLE_VPS_DEPLOY == 'true'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/levelup/web-react/server/auth-api
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
